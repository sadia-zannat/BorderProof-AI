name: BorderProof V5 independent checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-major Python dependencies
        run: python -m pip install -r services/api/requirements-dev.txt
      - name: Locale checks
        run: python scripts/check_locales.py
      - name: Generate and evaluate authored synthetic holdout
        run: |
          python -m benchmarks.stupay_integritybench.corpus
          python -m benchmarks.stupay_integritybench.evaluator --split holdout --out benchmarks/results
      - name: API/financial/security test suite
        run: python -m pytest services/api/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install (NOT verified in original V5 build)
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Actual Next.js semantic typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Actual Next.js production build
        working-directory: apps/web
        run: npm run build
