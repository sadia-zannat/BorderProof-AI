function networkMap(){const n=state.network, country=REGION_NAMES;let points=country.map((c,i)=>{let a=(i/country.length*2-.5)*Math.PI;return {c,x:220+145*Math.cos(a),y:176+145*Math.sin(a)}});let o=points.find(p=>p.c===n.origin);return `<svg viewBox="0 0 440 355" role="img" aria-label="Selectable bilateral routes" style="display:block;width:100%;max-height:390px"><circle cx="220" cy="176" r="150" fill="#103b50" stroke="#2ab2bb" stroke-opacity=".4"/>${points.filter(p=>p!==o).map(p=>`<path d="M${o.x} ${o.y} Q220 ${176+(p.c===n.target?38:-20)} ${p.x} ${p.y}" fill="none" stroke="${p.c===n.target?'#63f5cc':'#49859c'}" stroke-width="${p.c===n.target?3:1}" opacity="${p.c===n.target?1:.25}"/>`).join('')}${points.map(p=>`<g role="button" tabindex="0" onclick="networkPairSelect('target','${esc(p.c)}')" onkeydown="if(event.key==='Enter')networkPairSelect('target','${esc(p.c)}')" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="25" fill="${p.c===n.target?'#146f78':'#17334e'}" stroke="#50dacc"/><text x="${p.x}" y="${p.y+2}" text-anchor="middle" font-size="20">${REGIONS[p.c][1]}</text><text x="${p.x}" y="${p.y+17}" fill="white" text-anchor="middle" font-size="9">${REGIONS[p.c][0]}</text></g>`).join('')}<text x="220" y="177" fill="white" font-weight="800" text-anchor="middle" font-size="19">${REGIONS[n.origin][0]} → ${REGIONS[n.target][0]}</text><text x="220" y="198" text-anchor="middle" fill="#b5d2db" font-size="10">REVIEW REQUIRED</text></svg>`}
